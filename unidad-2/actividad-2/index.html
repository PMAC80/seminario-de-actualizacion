<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W3Admin Dashboard</title>
  
  <!-- Enlaces a CSS (OBLIGATORIO mantenerlos según la consigna del profeee) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./assets/icons/font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./assets/css/w3pro-4.13.css">
  <link rel="stylesheet" href="./assets/css/w3-theme.css">
  <link rel="stylesheet" href="./assets/css/admin-styles.css">
  <link rel="stylesheet" href="./assets/css/scrollbar.css">
</head>

<body class="w3-light-grey">
</body>

<script>

  // ================================================================
  // WEBCOMPONENT: WCApplicationView
  // Punto 2: Implementación del WebComponent libre de HTML
  // Punto 4: Encapsulamiento de elementos compuestos en métodos
  // ================================================================
  class WCApplicationView extends HTMLElement
  {
      constructor()
      {
          super(); // Llamada obligatoria al constructor de la clase base HTMLElement

          // Inicialización de referencias a null
          // Se usarán en connectedCallback para vincular eventos
          this.application = null;
          this.navbar = null;
          this.sidebar = null;
          this.content = null;
          this.footer = null;

          // Referencias específicas para manejo de eventos
          this.menuButton = null;
          this.searchTrigger = null; // Renombrado de searchButton para mayor claridad semántica

          // Bind de los manejadores de eventos para mantener el contexto de la clase
          // Esto es necesario porque addEventListener cambia el contexto de 'this'
          this.onMenuButtonClick = this.onMenuButtonClick.bind(this);
          this.onSearchTriggerClick = this.onSearchTriggerClick.bind(this);

          // Construcción de todos los elementos gráficos del componente
          // Punto 4: Cada método encapsula un elemento compuesto significativo
          this.navbar = this.createNavbar();
          this.sidebar = this.createSidebar();
          this.content = this.createContent();
          this.footer = this.createFooter();

          // Construcción del contenedor principal que agrupa todos los elementos
          this.application = this.createApplication();
      }

      /* =======================================================
         CICLO DE VIDA DEL WEBCOMPONENT
         Métodos obligatorios según el apunte de cátedra
         ======================================================= */

      // Se ejecuta cuando el elemento es insertado en el DOM
      // Propósito: Insertar la estructura construida y vincular eventos
      connectedCallback()
      {
          // Insertar toda la estructura del componente en el DOM
          this.appendChild(this.application);

          // Vinculación de manejadores de eventos
          // Punto 3: Migración de manejadores embebidos a addEventListener
          if (this.menuButton) 
          {
            this.menuButton.addEventListener("click", this.onMenuButtonClick);
          }

          if (this.searchTrigger) 
          {
            this.searchTrigger.addEventListener("click", this.onSearchTriggerClick);
          }
      }

      // Se ejecuta cuando el elemento es removido del DOM
      // Propósito: Liberar recursos y desvincular eventos para evitar memory leaks
      disconnectedCallback()
      {
          // Desvinculación de manejadores de eventos
          if (this.menuButton) 
          {
            this.menuButton.removeEventListener("click", this.onMenuButtonClick);
          }

          if (this.searchTrigger) 
          {
            this.searchTrigger.removeEventListener("click", this.onSearchTriggerClick);
          }
      }

      // Se ejecuta cuando el elemento es movido entre documentos DOM
      // No se requiere implementación específica para este caso
      adoptedCallback() {}

      // Se ejecuta cuando cambian atributos observados
      // No se requiere implementación específica para este caso
      attributeChangedCallback(name, oldValue, newValue) {}

      // Devuelve array de atributos a observar
      // Array vacío porque no necesitamos observar atributos en esta implementación
      static get observedAttributes() { return []; }

      /* =======================================================
         CONSTRUCCIÓN GENERAL
         Métodos que construyen la estructura completa del componente
         ======================================================= */

      // Construye el contenedor principal que agrupa todos los elementos
      // Encapsula: checkbox de control + navbar + sidebar + content (que incluye footer)
      createApplication()
      {
          // Bloque 1: Creación de elementos
          let app = document.createElement("div");
          let checkbox = document.createElement("input");

          // Bloque 2: Asignación de clases, estilos y atributos
          app.id = "app"; // ID necesario para estructura CSS
          checkbox.id = "sidebar-control"; // ID necesario para el truco del checkbox que controla el sidebar
          checkbox.type = "checkbox";
          checkbox.classList.add("w3-hide"); // Ocultar el checkbox visualmente

          // Ensamblaje de la estructura
          app.appendChild(checkbox);
          app.appendChild(this.navbar);
          app.appendChild(this.sidebar);
          
          // El footer se inserta dentro del content
          this.content.appendChild(this.footer);
          app.appendChild(this.content);

          return app;
      }

      // Construye la barra de navegación superior (navbar)
      // Encapsula: logo + botón menú + buscador + botones derechos + botón usuario
      createNavbar()
      {
          // Bloque 1: Creación de elementos
          let navbar = document.createElement("div");
          let flexBar = document.createElement("div");

          // Bloque 2: Asignación de clases y estilos
          navbar.classList.add("w3-top", "w3-card");
          navbar.style.height = "54px";
          flexBar.classList.add("w3-flex-bar", "w3-theme", "w3-left-align");

          // Ensamblaje de componentes del navbar
          flexBar.appendChild(this.createLogo());
          flexBar.appendChild(this.createMenuButton());
          flexBar.appendChild(this.createSearchContainer());
          flexBar.appendChild(this.createRightButtons());
          flexBar.appendChild(this.createUserButton());

          navbar.appendChild(flexBar);
          return navbar;
      }

      // Construye la barra lateral izquierda (sidebar)
      // Encapsula: header del sidebar (visible en mobile) + menú de navegación
      createSidebar()
      {
          // Bloque 1: Creación de elementos
          let nav = document.createElement("nav");

          // Bloque 2: Asignación de clases y estilos
          nav.id = "sidebar"; // ID necesario para el truco del checkbox
          nav.classList.add("w3-sidebar", "w3-top", "w3-bottom", "w3-collapse", "w3-white", "w3-border-right", "w3-border-top", "scrollbar");
          nav.style.zIndex = "3";
          nav.style.width = "230px";
          nav.style.height = "auto";
          nav.style.marginTop = "54px"; // Espacio para el navbar
          nav.style.setProperty("border-color", "rgba(0, 0, 0, .1)", "important");

          // Ensamblaje de componentes del sidebar
          nav.appendChild(this.createSidebarHeader());
          nav.appendChild(this.createSidebarMenu());

          return nav;
      }

      // Construye el área de contenido principal
      // Encapsula: contenedor main + div de contenido (vacío según consigna)
      createContent()
      {
          // Bloque 1: Creación de elementos
          let main = document.createElement("div");
          let contentDiv = document.createElement("div");

          // Bloque 2: Asignación de clases y estilos
          main.classList.add("w3-main");
          main.style.marginTop = "54px"; // Espacio para el navbar
          contentDiv.style.padding = "16px 32px";

          // Ensamblaje
          main.appendChild(contentDiv);
          return main;
      }

      // Construye el pie de página (footer)
      // Encapsula: texto "Powered with ♥ by W3Mix.com"
      createFooter()
      {
          // Bloque 1: Creación de elementos
          let footer = document.createElement("footer");
          let spanFooter = document.createElement("span");
          let spanHeart = document.createElement("span");
          let footerLink = document.createElement("a");
          let strongFooter = document.createElement("strong");
          let textNode = document.createTextNode("Powered with ");
          let heartNode = document.createTextNode("♥");
          let byNode = document.createTextNode(" by ");

          // Bloque 2: Asignación de clases y estilos
          footer.classList.add("w3-padding", "w3-border-top", "w3-center", "w3-white", "w3-margin-top");
          spanFooter.classList.add("w3-opacity");
          spanHeart.classList.add("w3-text-red");
          footerLink.href = "https://w3mix.com";
          footerLink.target = "_blank";
          strongFooter.textContent = "W3Mix.com";

          // Ensamblaje del footer
          footerLink.appendChild(strongFooter);
          spanHeart.appendChild(heartNode);
          spanFooter.appendChild(textNode);
          spanFooter.appendChild(spanHeart);
          spanFooter.appendChild(byNode);
          spanFooter.appendChild(footerLink);
          spanFooter.appendChild(document.createTextNode("."));
          footer.appendChild(spanFooter);

          return footer;
      }

      /* =======================================================
         COMPONENTES REUTILIZABLES
         Punto 4: Encapsulamiento de elementos compuestos
         ======================================================= */

      // Encapsula un botón genérico con icono para la barra superior
      // Parámetro: iconClass - clase del icono FontAwesome (ej: "fa-envelope-open")
      createTopButton(iconClass)
      {
          // Bloque 1: Creación de elementos
          let button = document.createElement("button");
          let icon = document.createElement("i");

          // Bloque 2: Asignación de clases y estilos
          button.type = "button";
          button.classList.add("w3-button", "w3-large", "w3-opacity-min");
          icon.classList.add("fa", iconClass);

          button.appendChild(icon);
          return button;
      }

      // Encapsula un ítem del menú lateral con icono y texto
      // Parámetros: iconClass - clase del icono, text - texto del ítem, href - enlace
      createSidebarItem(iconClass, text, href)
      {
          // Bloque 1: Creación de elementos
          let item = document.createElement("a");
          let icon = document.createElement("i");
          let label = document.createTextNode("\u00A0 " + text); // \u00A0 es espacio no rompible

          // Bloque 2: Asignación de clases y estilos
          item.href = href;
          item.classList.add("w3-bar-item", "w3-button", "w3-padding-large", "w3-hover-text-primary");
          
          // Dividir clases del icono si hay múltiples (ej: "fa-bar-chart" o "fa fa-fw fa-bar-chart")
          const iconClasses = iconClass.split(" ");
          icon.classList.add("fa", "fa-fw");
          iconClasses.forEach(cls => icon.classList.add(cls));

          item.appendChild(icon);
          item.appendChild(label);

          return item;
      }

      // Encapsula el botón de usuario con círculo y icono
      createUserButton()
      {
          // Bloque 1: Creación de elementos
          let button = document.createElement("div");
          let circle = document.createElement("div");
          let icon = document.createElement("i");

          // Bloque 2: Asignación de clases y estilos
          button.classList.add("w3-button");
          circle.classList.add("w3-circle", "w3-center", "w3-text-white", "w3-primary");
          circle.style.width = "38px";
          circle.style.height = "38px";
          icon.classList.add("fa", "fa-fw", "fa-user", "fa");
          icon.style.marginTop = "11px";

          circle.appendChild(icon);
          button.appendChild(circle);

          return button;
      }

      /* =======================================================
         MÉTODOS PRIVADOS DE LA NAVBAR
         ======================================================= */

      // Encapsula el logo completo (imagen + texto "W3Admin")
      createLogo()
      {
          // Bloque 1: Creación de elementos
          let container = document.createElement("div");
          let title = document.createElement("h5");
          let link = document.createElement("a");
          let img = document.createElement("img");
          let text = document.createTextNode("\u00A0 W3Admin");

          // Bloque 2: Asignación de clases y estilos
          container.classList.add("admin-logo", "w3-bar-item", "w3-hide-medium", "w3-hide-small");
          title.style.lineHeight = "1";
          title.style.setProperty("margin", "0", "important");
          title.style.fontWeight = "300";
          link.href = "./index.html";
          link.classList.add("w3-button", "w3-bold");
          img.src = "./assets/admin-logo.png";
          img.alt = "w3mix";
          img.classList.add("w3-image");
          img.width = 26;

          // Ensamblaje del logo
          link.appendChild(img);
          link.appendChild(text);
          title.appendChild(link);
          container.appendChild(title);

          return container;
      }

      // Encapsula el botón hamburguesa para mostrar/ocultar el sidebar
      createMenuButton()
      {
          // Bloque 1: Creación de elementos
          let label = document.createElement("label");
          let icon = document.createElement("i");

          // Bloque 2: Asignación de clases y estilos
          label.htmlFor = "sidebar-control"; // Vincula el label al checkbox por su ID
          label.classList.add("w3-button", "w3-large", "w3-opacity-min");
          icon.classList.add("fa", "fa-bars");

          label.appendChild(icon);
          
          // Guardar referencia para vincular evento en connectedCallback
          this.menuButton = label;

          return label;
      }

      // Encapsula el contenedor del buscador con trigger clickeable
      // Punto 3: Migración del manejador embebido onclick
      createSearchContainer()
      {
          // Bloque 1: Creación de elementos
          let container = document.createElement("div");
          let trigger = document.createElement("div");
          let icon = document.createElement("i");

          // Bloque 2: Asignación de clases y estilos
          container.style.width = "40%";
          trigger.classList.add("w3-display-right", "w3-padding-small", "w3-margin-right");
          icon.classList.add("fa", "fa-search", "w3-opacity-max");

          // Ensamblaje
          trigger.appendChild(icon);
          container.appendChild(trigger);
          
          // Guardar referencia para vincular evento en connectedCallback
          // Punto 3: Este trigger reemplaza el onclick inline original
          this.searchTrigger = trigger;

          return container;
      }

      // Encapsula los botones derechos del navbar (envelope y bell)
      createRightButtons()
      {
          // Bloque 1: Creación de elementos
          let container = document.createElement("div");

          // Bloque 2: Asignación de clases y estilos
          container.classList.add("w3-right");

          // Ensamblaje usando el método reutilizable createTopButton
          container.appendChild(this.createTopButton("fa-envelope-open"));
          container.appendChild(this.createTopButton("fa-bell"));

          return container;
      }

      /* =======================================================
         MÉTODOS PRIVADOS DEL SIDEBAR
         ======================================================= */

      // Encapsula el header del sidebar (visible solo en mobile)
      // Contiene el logo y botón para cerrar el sidebar
      createSidebarHeader()
      {
          // Bloque 1: Creación de elementos
          let header = document.createElement("div");
          let label = document.createElement("label");
          let icon = document.createElement("i");
          let title = document.createElement("h5");
          let link = document.createElement("a");
          let img = document.createElement("img");
          let text = document.createTextNode("\u00A0 W3Admin");

          // Bloque 2: Asignación de clases y estilos
          header.classList.add("w3-bar-item", "w3-border-bottom", "w3-hide-large");
          header.style.padding = "6px 0";

          label.htmlFor = "sidebar-control";
          label.classList.add("w3-left", "w3-button", "w3-large", "w3-opacity-min");
          label.style.setProperty("background", "white", "important");
          icon.classList.add("fa", "fa-bars");

          title.style.lineHeight = "1";
          title.style.setProperty("margin", "0", "important");
          title.style.fontWeight = "300";
          link.href = "./index.html";
          link.classList.add("w3-button");
          link.style.setProperty("background", "white", "important");
          img.src = "./assets/admin-logo.png";
          img.alt = "w3mix";
          img.classList.add("w3-image");

          // Ensamblaje del header del sidebar
          label.appendChild(icon);
          link.appendChild(img);
          link.appendChild(text);
          title.appendChild(link);
          header.appendChild(label);
          header.appendChild(title);

          return header;
      }

      // Encapsula el menú de navegación del sidebar
      // Contiene título "MAIN NAVIGATION" y 3 ítems: Dashboard, Forms, Login
      createSidebarMenu()
      {
          // Bloque 1: Creación de elementos
          let menu = document.createElement("div");
          let navTitle = document.createElement("span");

          // Bloque 2: Asignación de clases y estilos
          menu.classList.add("w3-bar-block");

          navTitle.classList.add("w3-bar-item", "w3-padding", "w3-small", "w3-opacity");
          navTitle.style.marginTop = "8px";
          navTitle.textContent = " MAIN NAVIGATION ";

          // Ensamblaje usando el método reutilizable createSidebarItem
          menu.appendChild(navTitle);
          menu.appendChild(this.createSidebarItem("fa-bar-chart", "Dashboard", "./index.html"));
          menu.appendChild(this.createSidebarItem("fa-edit", "Forms", "./forms.html"));
          menu.appendChild(this.createSidebarItem("fa-lock", "Login", "./login.html"));

          return menu;
      }

      /* =======================================================
         EVENTOS
         Punto 3: Manejadores migrados desde onclick inline
         ======================================================= */

      // Manejador para el botón hamburguesa del menú
      onMenuButtonClick(event)
      {
          console.log("🍔 [VISTA] Click en botón hamburguesa");
      }

      // Manejador para el trigger del buscador
      // Punto 3: Reemplaza el onclick="this.parentNode.children[1].focus()" original
      // event.currentTarget es el elemento DOM que recibió el click (equivale al "this" del onclick inline)
      onSearchTriggerClick(event)
      {
          // Replicar exactamente el comportamiento del onclick inline original
          // this.parentNode.children[1].focus() se convierte en:
          event.currentTarget.parentNode.children[1].focus();
          
          console.log("🔍 [VISTA] Click en trigger de búsqueda");
      }
  }

  // ================================================================
  // REGISTRO DEL WEBCOMPONENT
  // Obligatorio según el apunte: customElements.define()
  // El nombre debe contener un guión (requisito del estándar)
  // ================================================================
  customElements.define("wc-application-view", WCApplicationView);

  // ================================================================
  // FUNCIÓN MAIN
  // Instanciación y inserción del WebComponent en el DOM
  // ================================================================
  function main()
  {
      let myView = new WCApplicationView();
      document.body.appendChild(myView);
  }

  // Ejecutar main cuando la ventana cargue completamente
  window.onload = main;

</script>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>W3Admin Dashboard</title>
  
  <!-- Enlaces a CSS (OBLIGATORIO mantenerlos) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./assets/icons/font-awesome-4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./assets/css/w3pro-4.13.css">
  <link rel="stylesheet" href="./assets/css/w3-theme.css">
  <link rel="stylesheet" href="./assets/css/admin-styles.css">
  <link rel="stylesheet" href="./assets/css/scrollbar.css">
</head>

<body class="w3-light-grey">
</body>

<script>

    // ==========================================
    // FUNCIÓN AUXILIAR (Para los botones repetidos del menú)
    // ==========================================
    function createMenuButton(iconClass, text, href) {
        // BLOQUE 1: CREAR
        const a = document.createElement('a');
        const i = document.createElement('i');
        const textNode = document.createTextNode('\u00A0 ' + text);
        
        // BLOQUE 2: ASIGNAR
        a.href = href;
        a.classList.add('w3-bar-item', 'w3-button', 'w3-padding-large', 'w3-hover-text-primary');
        
        // Separamos las clases por espacio para agregarlas bien
        const iconClasses = iconClass.split(' ');
        i.classList.add('fa', 'fa-fw');
        iconClasses.forEach(cls => i.classList.add(cls));
        
        // BLOQUE 3: UNIR
        a.appendChild(i);
        a.appendChild(textNode);
        
        return a;
    }

    // ==========================================
    // FUNCIÓN PARA CREAR LA BARRA SUPERIOR (CORREGIDA)
    // ==========================================
    function createNavbar() {
        // BLOQUE 1: CREAR
        const navbar = document.createElement('div');
        const flexBar = document.createElement('div');
        
        const logoContainer = document.createElement('div');
        const logoTitle = document.createElement('h5');
        const logoLink = document.createElement('a');
        const logoImg = document.createElement('img');
        const logoText = document.createTextNode('\u00A0 W3Admin');
        
        const hamburgerLabel = document.createElement('label');
        const hamburgerIcon = document.createElement('i');
        
        // (Eliminamos el contenedor de búsqueda que rompía todo)
        
        const rightButtons = document.createElement('div');
        const btnEnvelope = document.createElement('button');
        const iconEnvelope = document.createElement('i');
        const btnBell = document.createElement('button');
        const iconBell = document.createElement('i');
        
        const userContainer = document.createElement('div');
        const userButton = document.createElement('div');
        const userCircle = document.createElement('div');
        const userIcon = document.createElement('i');

        // BLOQUE 2: ASIGNAR
        navbar.classList.add('w3-top', 'w3-card');
        navbar.style.height = '54px';
        flexBar.classList.add('w3-flex-bar', 'w3-theme', 'w3-left-align');

        logoContainer.classList.add('admin-logo', 'w3-bar-item', 'w3-hide-medium', 'w3-hide-small');
        logoTitle.style.lineHeight = '1';
        logoTitle.style.setProperty('margin', '0', 'important');
        logoTitle.style.fontWeight = '300';
        logoLink.href = './index.html';
        logoLink.classList.add('w3-button', 'w3-bold');
        logoImg.src = './assets/admin-logo.png';
        logoImg.alt = 'w3mix';
        logoImg.classList.add('w3-image');
        logoImg.width = 26;

        hamburgerLabel.htmlFor = 'sidebar-control';
        hamburgerLabel.classList.add('w3-button', 'w3-large', 'w3-opacity-min');
        hamburgerIcon.classList.add('fa', 'fa-bars');

        rightButtons.classList.add('w3-right');
        btnEnvelope.type = 'button';
        btnEnvelope.classList.add('w3-button', 'w3-large', 'w3-opacity-min');
        iconEnvelope.classList.add('fa', 'fa-envelope-open');
        btnBell.type = 'button';
        btnBell.classList.add('w3-button', 'w3-large', 'w3-opacity-min');
        iconBell.classList.add('fa', 'fa-bell');

        userContainer.classList.add('text-right');
        userButton.classList.add('w3-button');
        userCircle.classList.add('w3-circle', 'w3-center', 'w3-text-white', 'w3-primary');
        userCircle.style.width = '38px';
        userCircle.style.height = '38px';
        userIcon.classList.add('fa', 'fa-fw', 'fa-user', 'fa');
        userIcon.style.marginTop = '11px';

        // BLOQUE 3: UNIR
        logoLink.appendChild(logoImg);
        logoLink.appendChild(logoText);
        logoTitle.appendChild(logoLink);
        logoContainer.appendChild(logoTitle);

        hamburgerLabel.appendChild(hamburgerIcon);

        btnEnvelope.appendChild(iconEnvelope);
        btnBell.appendChild(iconBell);
        rightButtons.appendChild(btnEnvelope);
        rightButtons.appendChild(btnBell);

        userCircle.appendChild(userIcon);
        userButton.appendChild(userCircle);
        userContainer.appendChild(userButton);

        flexBar.appendChild(logoContainer);
        flexBar.appendChild(hamburgerLabel);
        // (Ya no agregamos el contenedor de búsqueda)
        flexBar.appendChild(rightButtons);
        flexBar.appendChild(userContainer);

        navbar.appendChild(flexBar);

        return navbar;
    }

    // ==========================================
    // FUNCIÓN PARA CREAR EL MENÚ LATERAL
    // ==========================================
    function createSidebar() {
        // BLOQUE 1: CREAR
        const nav = document.createElement('nav');
        const mobileHeader = document.createElement('div');
        const hamburgerLabel = document.createElement('label');
        const hamburgerIcon = document.createElement('i');
        const logoTitle = document.createElement('h5');
        const logoLink = document.createElement('a');
        const logoImg = document.createElement('img');
        const logoText = document.createTextNode('\u00A0 W3Admin');
        const menuContainer = document.createElement('div');
        const navTitle = document.createElement('span');
        const labelsTitle = document.createElement('span');

        // BLOQUE 2: ASIGNAR
        nav.id = 'sidebar';
        nav.classList.add('w3-sidebar', 'w3-top', 'w3-bottom', 'w3-collapse', 'w3-white', 'w3-border-right', 'w3-border-top', 'scrollbar');
        nav.style.zIndex = '3';
        nav.style.width = '230px';
        nav.style.height = 'auto';
        nav.style.marginTop = '54px';
        nav.style.setProperty('border-color', 'rgba(0, 0, 0, .1)', 'important');

        mobileHeader.classList.add('w3-bar-item', 'w3-border-bottom', 'w3-hide-large');
        mobileHeader.style.padding = '6px 0';

        hamburgerLabel.htmlFor = 'sidebar-control';
        hamburgerLabel.classList.add('w3-left', 'w3-button', 'w3-large', 'w3-opacity-min');
        hamburgerLabel.style.setProperty('background', 'white', 'important');
        hamburgerIcon.classList.add('fa', 'fa-bars');

        logoTitle.style.lineHeight = '1';
        logoTitle.style.setProperty('margin', '0', 'important');
        logoTitle.style.fontWeight = '300';
        logoLink.href = './index.html';
        logoLink.classList.add('w3-button');
        logoLink.style.setProperty('background', 'white', 'important');
        logoImg.src = './assets/admin-logo.png';
        logoImg.alt = 'w3mix';
        logoImg.classList.add('w3-image');

        menuContainer.classList.add('w3-bar-block');
        navTitle.classList.add('w3-bar-item', 'w3-padding', 'w3-small', 'w3-opacity');
        navTitle.style.marginTop = '8px';
        navTitle.textContent = ' MAIN NAVIGATION ';
        labelsTitle.classList.add('w3-bar-item', 'w3-padding', 'w3-small', 'w3-opacity');
        labelsTitle.textContent = ' LABELS ';

        // BLOQUE 3: UNIR
        hamburgerLabel.appendChild(hamburgerIcon);
        logoLink.appendChild(logoImg);
        logoLink.appendChild(logoText);
        logoTitle.appendChild(logoLink);
        mobileHeader.appendChild(hamburgerLabel);
        mobileHeader.appendChild(logoTitle);

        menuContainer.appendChild(navTitle);
        menuContainer.appendChild(createMenuButton('fa-bar-chart', 'Dashboard', './index.html'));
        menuContainer.appendChild(createMenuButton('fa-fire', 'UI Icons', './icons.html'));
        menuContainer.appendChild(createMenuButton('fa-edit', 'Forms', './forms.html'));
        menuContainer.appendChild(createMenuButton('fa-table', 'Tables', './tables.html'));
        menuContainer.appendChild(createMenuButton('fa-user-circle', 'Profile', './profile.html'));
        menuContainer.appendChild(createMenuButton('fa-lock', 'Login', './login.html'));
        menuContainer.appendChild(createMenuButton('fa-sign-in', 'Registration', './register.html'));
        
        menuContainer.appendChild(labelsTitle);
        menuContainer.appendChild(createMenuButton('fa-coffee w3-text-danger', 'Important', '#dashboard'));
        menuContainer.appendChild(createMenuButton('fa-circle-o-notch w3-text-success', 'Warning', '#dashboard'));
        menuContainer.appendChild(createMenuButton('fa-share-alt w3-text-info', 'Information', '#dashboard'));

        nav.appendChild(mobileHeader);
        nav.appendChild(menuContainer);

        return nav;
    }
        // ==========================================
    // FUNCIÓN PARA EL CHECKBOX (Para que abra/cierre el menú)
    // ==========================================
    function createCheckboxToggle() {
        // BLOQUE 1: CREAR
        const input = document.createElement('input');
        
        // BLOQUE 2: ASIGNAR
        input.id = 'sidebar-control';
        input.type = 'checkbox';
        input.classList.add('w3-hide'); // w3-hide lo hace invisible
        
        // BLOQUE 3: UNIR (no hace falta unir nada aquí, es un elemento suelto)
        return input;
    }

    // ==========================================
    // FUNCIÓN PARA EL CUERPO Y FOOTER
    // ==========================================
    function createMainAndFooter() {
        // BLOQUE 1: CREAR
        const mainContainer = document.createElement('div');
        const contentDiv = document.createElement('div');
        const footer = document.createElement('footer');
        const spanFooter = document.createElement('span');
        const spanHeart = document.createElement('span');
        const footerLink = document.createElement('a');
        const strongFooter = document.createElement('strong');
        const textNode = document.createTextNode('Powered with ');
        const heartNode = document.createTextNode('♥'); // Corazón
        const byNode = document.createTextNode(' by ');

        // BLOQUE 2: ASIGNAR
        mainContainer.classList.add('w3-main');
        mainContainer.style.marginTop = '54px';

        contentDiv.style.padding = '16px 32px';
        // contentDiv queda vacío intencionalmente

        footer.classList.add('w3-padding', 'w3-border-top', 'w3-center', 'w3-white', 'w3-margin-top');
        spanFooter.classList.add('w3-opacity');
        spanHeart.classList.add('w3-text-red');
        
        footerLink.href = 'https://w3mix.com';
        footerLink.target = '_blank';

        // BLOQUE 3: UNIR
        footerLink.appendChild(strongFooter);
        strongFooter.textContent = 'W3Mix.com';
        
        spanHeart.appendChild(heartNode);
        spanFooter.appendChild(textNode);
        spanFooter.appendChild(spanHeart);
        spanFooter.appendChild(byNode);
        spanFooter.appendChild(footerLink);
        spanFooter.appendChild(document.createTextNode('.')); // Punto final
        
        footer.appendChild(spanFooter);
        
        mainContainer.appendChild(contentDiv);
        mainContainer.appendChild(footer);

        return mainContainer;
    }
    // ==========================================
    // CLASE DEL WEBCOMPONENT
    // ==========================================
    class WCApplicationView extends HTMLElement {
        constructor() {
            super();

            this.checkbox = createCheckboxToggle();
            this.navbar = createNavbar();
            this.sidebar = createSidebar();
            this.main = createMainAndFooter();
            
            this.appendChild(this.checkbox);
            this.appendChild(this.navbar);
            this.appendChild(this.sidebar);
            this.appendChild(this.main);
        }

        // Se ejecuta cuando el componente se agrega al HTML
        connectedCallback() {
            console.log(' [VISTA] Componente agregado al DOM. Vinculando eventos...');
            
            // Buscamos el botón hamburguesa dentro de nuestra navbar
            // (Como es un label con la clase 'w3-button' y 'w3-large')
            this.hamburgerBtn = this.querySelector('label[for="sidebar-control"]');
            
            if (this.hamburgerBtn) {
                // Vinculamos el evento click
                this._onHamburgerClick = this._onHamburgerClick.bind(this);
                this.hamburgerBtn.addEventListener('click', this._onHamburgerClick);
            }
        }

        // Se ejecuta cuando el componente se quita del HTML
        disconnectedCallback() {
            console.log('🔴 [VISTA] Componente quitado del DOM. Desvinculando eventos...');
            
            // Desvinculamos el evento para evitar fugas de memoria
            if (this.hamburgerBtn) {
                this.hamburgerBtn.removeEventListener('click', this._onHamburgerClick);
            }
        }

        // El método que maneja el evento
        _onHamburgerClick(event) {
            console.log('🖱️ [VISTA] Se hizo clic en el botón hamburguesa');
        }
    }  customElements.define('x-application-view', WCApplicationView);

  // ==========================================
  // FUNCIÓN MAIN (Como en la calculadora)
  // ==========================================
function main() {
    let myView = new WCApplicationView();
    document.body.appendChild(myView);
}

window.onload = main;
</script>
  
</html>

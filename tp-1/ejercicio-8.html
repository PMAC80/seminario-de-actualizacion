  
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatures</title>
</head>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>
</body>
<script>
class Temperatures extends HTMLElement 
{
    constructor() 
    {
        super();
        this.innerHTML = `<h2>Temperaturas de Mar del Plata</h2>`;

        this.data = [
            { name: 'Monday', temperature: [20, 22, 21, 19, 18, 17, 16] },
            { name: 'Tuesday', temperature: [21, 23, 22, 20, 19, 18, 17] },
            { name: 'Wednesday', temperature: [22, 24, 23, 21, 20, 19, 18] },
            { name: 'Thursday', temperature: [23, 25, 24, 22, 21, 20, 19] },
            { name: 'Friday', temperature: [24, 26, 25, 23, 22, 21, 20] },
            { name: 'Saturday', temperature: [25, 27, 26, 24, 23, 22, 21] },
            { name: 'Sunday', temperature: [26, 28, 27, 25, 24, 23, 22] }
        ];

        this.isCelsius = true;

        this.btnAverages = document.createElement('button');
        this.btnAverages.innerText = 'Show Averages';

        this.btnScale = document.createElement('button');
        this.btnScale.innerText = 'Change to Fahrenheit';

        this.display = document.createElement('p');
        this.btnPrint = document.createElement('button');
        this.btnPrint.innerText = 'Print';

        this.btnPNG = document.createElement('button');
        this.btnPNG.innerText = 'PNG';

        this.btnCSV = document.createElement('button');
        this.btnCSV.innerText = 'CSV';

        this.btnPDF = document.createElement('button');
        this.btnPDF.innerText = 'PDF';

        this.btnExcel = document.createElement('button');
        this.btnExcel.innerText = 'Excel';

        this.appendChild(this.btnPrint);
        this.appendChild(this.btnPNG);
        this.appendChild(this.btnCSV);
        this.appendChild(this.btnPDF);
        this.appendChild(this.btnExcel);

        this.appendChild(this.btnAverages);
        this.appendChild(this.btnScale);
        this.appendChild(this.display);
    }
        
    showData() 
    {
        let text = "";
        
        this.data.forEach(day => {
            let sum = 0;
            day.temperature.forEach(temp => {
                let value = this.isCelsius ? temp : (temp * 9/5) + 32;
                sum += value;
            });
            
            let average = sum / day.temperature.length;
            let unit = this.isCelsius ? "ºC" : "ºF";
            
            text += "Average for " + day.name + ": " + average.toFixed(1) + unit + "\n";
        });

        this.display.innerText = text;
    }

    toggleScale() 
    {
        this.isCelsius = !this.isCelsius;
        
        if (this.isCelsius) {
            this.btnScale.innerText = 'Change to Fahrenheit';
        } else {
            this.btnScale.innerText = 'Change to Celsius';
        }
        
        this.showData();
    }
        
    connectedCallback() 
    {
        this.btnAverages.onclick = this.showData.bind(this);
        this.btnScale.onclick = this.toggleScale.bind(this);
        this.btnPrint.onclick = this.print.bind(this);
        this.btnPNG.onclick = this.exportPNG.bind(this);
        this.btnCSV.onclick = this.exportCSV.bind(this);
        this.btnPDF.onclick = this.exportPDF.bind(this);
        this.btnExcel.onclick = this.exportExcel.bind(this);
    }

    disconnectedCallback() 
    {
        this.btnAverages.onclick = null;
        this.btnScale.onclick = null;
        this.btnPrint.onclick = null;
        this.btnPNG.onclick = null;
        this.btnCSV.onclick = null;
        this.btnPDF.onclick = null;
        this.btnExcel.onclick = null;
    }

    print()
    {
        window.print();
    }

    exportPNG()
    {
        html2canvas(this).then(canvas =>
        {
            const link = document.createElement("a");

            link.download = "temperatures.png";

            link.href = canvas.toDataURL("image/png");

            link.click();
        });
    }

    exportCSV()
    {
        let csv = "Day,Average\n";

        this.data.forEach(day =>
        {
            let sum = 0;

            day.temperature.forEach(temp =>
            {
                sum += temp;
            });

            let average = sum / day.temperature.length;

            csv += day.name + "," + average.toFixed(1) + "\n";
        });

        const blob = new Blob([csv], { type: "text/csv" });

        const link = document.createElement("a");

        link.href = URL.createObjectURL(blob);

        link.download = "temperatures.csv";

        link.click();
    }

    exportPDF()
    {
        html2pdf().from(this).save("temperatures.pdf");
    }

    exportExcel()
    {
        let rows = [];

        this.data.forEach(day =>
        {
            let sum = 0;

            day.temperature.forEach(temp =>
            {
                sum += temp;
            });

            rows.push(
            {
                Day: day.name,
                Average: (sum / day.temperature.length).toFixed(1)
            });
        });

        const ws = XLSX.utils.json_to_sheet(rows);

        const wb = XLSX.utils.book_new();

        XLSX.utils.book_append_sheet(wb, ws, "Temperatures");

        XLSX.writeFile(wb, "temperatures.xlsx");
    }
    
}
    
customElements.define('x-tabla', Temperatures);

function main() 
{
    let temperature = new Temperatures();
    document.body.appendChild(temperature);
}

window.onload = main;
</script>

</html>

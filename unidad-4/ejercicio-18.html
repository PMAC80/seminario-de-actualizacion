<script type="text/javascript">

function drawConicSquare(canvas, x, y, size, color1, color2, color3)
{
    let ctx = canvas.getContext('2d');

    let centerX = x + size / 2;
    let centerY = y + size / 2;

    //ctx.clearRect(0, 0, canvas.width, canvas.height);

    let gradient = ctx.createConicGradient(0, centerX, centerY);
    gradient.addColorStop(0, color1);
    gradient.addColorStop(0.5, color2);
    gradient.addColorStop(1, color3);

    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, size, size);
}

class Model extends EventTarget
{
    constructor()
    {
        super();
        this._x = 150;
        this._y = 100;
        this._size = 300;
        this._color1 = '#ff0000';
        this._color2 = '#00ff00';
        this._color3 = '#0000ff';
    }

    get x() { return this._x; }
    get y() { return this._y; }
    get size() { return this._size; }
    get color1() { return this._color1; }
    get color2() { return this._color2; }
    get color3() { return this._color3; }

    changed()
    {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement
{
    constructor()
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 600;
        this._canvas.height = 500;
        this._canvas.style.border = '2px solid black';
        this._canvas.style.backgroundColor = '#f5f5f5';
    }

    get canvas() { return this._canvas; }

    render(model)
    {
        drawConicSquare(
            this._canvas, 
            model.x, 
            model.y, 
            model.size, 
            model.color1, 
            model.color2, 
            model.color3
        );
    }

    connectedCallback()
    {
        this.appendChild(this._canvas);
    }
}

customElements.define('x-view', View);

class Controller
{
    constructor(view, model)
    {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
    }

    enable()
    {
        this._model.addEventListener('changed', this._onModelChanged);
    }

    onModelChanged()
    {
        this._view.render(this._model);
    }
}

function main()
{
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    
    myController.enable();
    myModel.changed();
    document.body.appendChild(myView);
}

window.onload = main;

</script>
</html>

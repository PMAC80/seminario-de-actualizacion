<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminario de Actualización - Unidad 4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .tab:hover {
            background-color: #d0d0d0;
        }

        .tab.active {
            background-color: #4CAF50;
            color: white;
        }

        .content {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            min-height: 600px;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>Seminario de Actualización - Unidad 4</h1>

<div class="tabs">
    <button class="tab active" onclick="showExercise('ejercicio-6')">Ejercicio 6</button>
    <button class="tab" onclick="showExercise('ejercicio-12')">Ejercicio 12</button>
    <button class="tab" onclick="showExercise('ejercicio-19')">Ejercicio 19</button>
</div>

<div class="content">
    <iframe id="exerciseFrame" src="ejercicio-6/index.html"></iframe>
</div>

<script type="text/javascript">

function showExercise(exercise)
{
    var frame = document.getElementById('exerciseFrame');
    frame.src = exercise + '/index.html';

    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++)
    {
        tabs[i].classList.remove('active');
    }

    event.target.classList.add('active');
}

</script>

</body>
</html>

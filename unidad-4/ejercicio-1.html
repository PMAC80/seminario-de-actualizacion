<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drawCross</title>
</head>

<body></body>

<script type="text/javascript">

// ==================================================================================
// MODELO
// ==================================================================================
class Model extends EventTarget
{
    constructor()
    {
        super();
        this._width = 500;
        this._height = 500;
    }

    get width()
    {
        return this._width;
    }

    get height()
    {
        return this._height;
    }

    changed()
    {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

// ==================================================================================
// VISTA
// ==================================================================================
class View extends HTMLElement
{
    constructor()
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 500;
        this._canvas.height = 500;
        this._canvas.style.border = '2px solid black';
    }

    get canvas()
    {
        return this._canvas;
    }

    render(model)
    {
        drawCross(this._canvas, model.width, model.height);
    }

    connectedCallback()
    {
        console.log('Canvas agregado...');
        this.appendChild(this._canvas);
    }

    disconnectedCallback()
    {
    }
}

customElements.define('x-view', View);

// ==================================================================================
// CONTROLADOR
// ==================================================================================
class Controller
{
    constructor(view, model)
    {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
        this._onViewRequest = this.onViewRequest.bind(this);
    }

    enable()
    {
        this._model.addEventListener('changed', this._onModelChanged);
        this._view.addEventListener('request', this._onViewRequest);
    }

    disable()
    {
        this._model.removeEventListener('changed', this._onModelChanged);
        this._view.removeEventListener('request', this._onViewRequest);
    }

    onModelChanged()
    {
        this._view.render(this._model);
    }

    onViewRequest(event)
    {
    }
}
function drawCross(canvas, width, height)
{
    let ctx = canvas.getContext('2d');

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(width, height);
    ctx.moveTo(0, height);
    ctx.lineTo(width, 0);
    ctx.closePath();
    ctx.stroke();
}


// ==================================================================================
// MAIN FUNCTION
// ==================================================================================
function main()
{
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    myController.enable();
    myModel.changed();
    document.body.appendChild(myView);
}

window.onload = main;

</script>
</html>

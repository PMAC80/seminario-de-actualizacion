<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>drawBrokenLines</title>
    </head>
    
    <body></body>
    
    <script type="text/javascript">

    function drawBrokenLines(canvas, model)
    {
        let ctx = canvas.getContext('2d');
        let data = model.data;

        ctx.lineWidth = 20;

        for (let i = 0; i < data.length; i++)
        {
            let line = data[i];
            let points = line.points;

            ctx.lineCap = line.lineCap;
            ctx.lineJoin = line.lineJoin;

            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);

            for (let j = 1; j < points.length; j++)
            {
                ctx.lineTo(points[j][0], points[j][1]);
            }

            ctx.stroke();
        }
    }

    class Model extends EventTarget
    {
        constructor()
        {
            super();
            this._data = [
                {
                    points: [[100, 100], [200, 50], [300, 150]],
                    lineCap: 'butt',
                    lineJoin: 'bevel'
                },
                {
                    points: [[100, 250], [200, 200], [300, 300]],
                    lineCap: 'round',
                    lineJoin: 'round'
                },
                {
                    points: [[100, 400], [200, 350], [300, 450]],
                    lineCap: 'square',
                    lineJoin: 'miter'
                }
            ];
        }

        get data()
        {
            return this._data;
        }

        changed()
        {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }

    class View extends HTMLElement
    {
        constructor()
        {
            super();
            this._canvas = document.createElement('canvas');
            this._canvas.width = 600;
            this._canvas.height = 500;
            this._canvas.style.border = '2px solid black';
        }

        render(renderFunction, model)
        {
            this._canvas.getContext('2d').clearRect(0, 0, this._canvas.width, this._canvas.height);
            renderFunction(this._canvas, model);
        }

        connectedCallback()
        {
            console.log('Canvas agregado...');
            this.appendChild(this._canvas);
        }

        disconnectedCallback()
        {
        }
    }

    customElements.define('x-view', View);

    class Controller
    {
        constructor(view, model)
        {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }

        enable()
        {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }

        disable()
        {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged()
        {
            this._view.render(drawBrokenLines, this._model);
        }

        onViewRequest(event)
        {
        }
    }

    function main()
    {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }

    window.onload = main;

    </script>
</html>

    <meta charset="UTF-8">

<script type="text/javascript">

function drawImageAt(canvas, img, x, y)
{
    let ctx = canvas.getContext('2d');
    ctx.drawImage(img, x, y);
}

class Model extends EventTarget
{
    constructor()
    {
        super();
        this._imageUrl = 'https://www.w3schools.com/html/pic_trulli.jpg';
        this._x = 150;
        this._y = 100;
    }

    get imageUrl() 
    { 
        return this._imageUrl; 
    }

    get x() 
    { 
        return this._x;
    }

    get y() 
    { 
        return this._y; 
    }
    

    changed()
    {
        this.dispatchEvent(new CustomEvent('changed'));
    }
}

class View extends HTMLElement
{
    constructor()
    {
        super();
        this._canvas = document.createElement('canvas');
        this._canvas.width = 600;
        this._canvas.height = 500;
        this._canvas.style.border = '2px solid black';
        this._canvas.style.backgroundColor = '#f5f5f5';
    }

    get canvas() 
    { 
        return this._canvas; 
    }

    render(model)
    {
        let img = new Image();
        
        img.onload = 
        function() 
        {
            drawImageAt(this._canvas, img, model.x, model.y);
        }
        .bind(this);
        
        img.src = model.imageUrl;
    }

    connectedCallback()
    {
        this.appendChild(this._canvas);
    }
}

customElements.define('x-view', View);

class Controller
{
    constructor(view, model)
    {
        this._view = view;
        this._model = model;
        this._onModelChanged = this.onModelChanged.bind(this);
    }

    enable()
    {
        this._model.addEventListener('changed', this._onModelChanged);
    }

    onModelChanged()
    {
        this._view.render(this._model);
    }
}

function main()
{
    let myModel = new Model();
    let myView = new View();
    let myController = new Controller(myView, myModel);
    
    myController.enable();
    myModel.changed();
    document.body.appendChild(myView);
}

window.onload = main;

</script>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>drawTriangle</title>
    </head>
    
    <body></body>
    
    <script type="text/javascript">

    function drawTriangle(canvas, a, b, c)
    {
        let ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(c.x, c.y);
        ctx.closePath();
        ctx.stroke();
    }

    class Model extends EventTarget
    {
        constructor()
        {
            super();
            this._a = { x: 200, y: 300 };
            this._b = { x: 400, y: 300 };
            this._c = { x: 300, y: 100 };
        }

        get a()
        {
            return this._a;
        }

        get b()
        {
            return this._b;
        }

        get c()
        {
            return this._c;
        }

        changed()
        {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }

    class View extends HTMLElement
    {
        constructor()
        {
            super();
            this._canvas = document.createElement('canvas');
            this._canvas.width = 600;
            this._canvas.height = 500;
            this._canvas.style.border = '2px solid black';
        }

        get canvas()
        {
            return this._canvas;
        }

        render(model)
        {
            drawTriangle(this._canvas, model.a, model.b, model.c);
        }

        connectedCallback()
        {
            console.log('Canvas agregado...');
            this.appendChild(this._canvas);
        }

        disconnectedCallback()
        {
        }
    }

    customElements.define('x-view', View);

    class Controller
    {
        constructor(view, model)
        {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }

        enable()
        {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }

        disable()
        {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged()
        {
            this._view.render(this._model);
        }

        onViewRequest(event)
        {
        }
    }

    function main()
    {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }

    window.onload = main;

    </script>
</html>

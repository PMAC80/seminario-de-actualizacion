<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>drawCake</title>
    </head>
    
    <body></body>
    
    <script type="text/javascript">

    function drawCake(canvas, model)
    {
        let ctx = canvas.getContext('2d');
        let centerX = canvas.width / 2;
        let centerY = canvas.height / 2;
        let radius = 150;
        let currentAngle = 0;

        for (let i = 0; i < model.data.length; i++)
        {
            let sliceAngle = model.data[i].percentage * 2 * Math.PI;

            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, currentAngle, currentAngle + sliceAngle);
            ctx.closePath();
            ctx.stroke();

            let midAngle = currentAngle + sliceAngle / 2;
            let textX = centerX + Math.cos(midAngle) * radius * 0.6;
            let textY = centerY + Math.sin(midAngle) * radius * 0.6;

            ctx.fillText(model.data[i].label, textX - 20, textY - 10);
            ctx.fillText((model.data[i].percentage * 100).toFixed(0) + '%', textX - 10, textY + 10);

            currentAngle += sliceAngle;
        }
    }

    class Model extends EventTarget
    {
        constructor()
        {
            super();
            this._data = [
                { percentage: 0.30, label: "Ventas" },
                { percentage: 0.50, label: "Marketing" },
                { percentage: 0.10, label: "I+D" },
                { percentage: 0.10, label: "Otros" }
            ];
        }

        get data()
        {
            return this._data;
        }

        changed()
        {
            this.dispatchEvent(new CustomEvent('changed'));
        }
    }

    class View extends HTMLElement
    {
        constructor()
        {
            super();
            this._canvas = document.createElement('canvas');
            this._canvas.width = 600;
            this._canvas.height = 500;
            this._canvas.style.border = '2px solid black';
        }

        render(renderFunction, model)
        {
            this._canvas.getContext('2d').clearRect(0, 0, this._canvas.width, this._canvas.height);
            renderFunction(this._canvas, model);
        }

        connectedCallback()
        {
            console.log('Canvas agregado...');
            this.appendChild(this._canvas);
        }

        disconnectedCallback()
        {
        }
    }

    customElements.define('x-view', View);

    class Controller
    {
        constructor(view, model)
        {
            this._view = view;
            this._model = model;
            this._onModelChanged = this.onModelChanged.bind(this);
            this._onViewRequest = this.onViewRequest.bind(this);
        }

        enable()
        {
            this._model.addEventListener('changed', this._onModelChanged);
            this._view.addEventListener('request', this._onViewRequest);
            this.onModelChanged();
        }

        disable()
        {
            this._model.removeEventListener('changed', this._onModelChanged);
            this._view.removeEventListener('request', this._onViewRequest);
        }

        onModelChanged()
        {
            this._view.render(drawCake, this._model);
        }

        onViewRequest(event)
        {
        }
    }

    function main()
    {
        let myModel = new Model();
        let myView = new View();
        let myController = new Controller(myView, myModel);
        myController.enable();
        document.body.appendChild(myView);
    }

    window.onload = main;

    </script>
</html>
